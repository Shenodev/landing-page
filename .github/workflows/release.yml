name: ShenoDev Production Release

on:
  push:
    tags:
      - 'v*' # يعمل الكود فقط عند إنشاء Tag جديد للإصدار

jobs:
  build-desktop-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./desktop # تأكد من تعديل المسار إذا كان مجلد الديسكتوب باسم مختلف
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Build & Publish Windows Installer
        run: npx electron-builder --win -p always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Build & Publish Linux Installer
        run: npx electron-builder --linux -p always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Build & Publish Mac (Intel & ARM)
        run: npx electron-builder --mac --x64 --arm64 -p always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mobile-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile # تأكد من اسم مجلد تطبيق الهاتف
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
          
      - run: npm install
      
      - name: Build Android APK on EAS Cloud
        # نستخدم خوادم EAS للقيام بالبناء الثقيل، ثم ننتظر استلام الملف الجاهز
        run: eas build --platform android --profile production --non-interactive --wait --output ./shenodev-android-production.apk
        
      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./mobile/shenodev-android-production.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}