name: ShenoDev Production Release

on:
  push:
    tags:
      - 'v*' # يعمل الكود فقط عند إنشاء Tag جديد للإصدار

jobs:
  build-desktop-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./desktop # تأكد من تعديل المسار إذا كان مجلد الديسكتوب باسم مختلف
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Build & Publish Windows Installer
        run: npx electron-builder --win -p always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build & Publish Linux AppImage & deb
        run: npx electron-builder --linux -p always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build & Publish Mac (Intel & ARM)
        run: npx electron-builder --mac --x64 --arm64 -p always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mobile-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm install

      # Link the EAS project under the robot's account (shenodevs-team) and commit
      # the generated projectId back so subsequent builds don't create new projects.
      - name: Link EAS project
        run: eas init --account shenodevs-team --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Commit EAS project link (idempotent)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json eas.json
          git diff --cached --quiet || git commit -m "chore(mobile): link EAS project for CI builds"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Cloud builds run on EAS servers. --output is only allowed for LOCAL builds,
      # so we build+wait with --json, capture the build ID, then download the APK.
      - name: Build Android APK on EAS Cloud
        id: eas-build
        run: |
          eas build --platform android --profile production --non-interactive --wait --json > eas-build-output.json
          echo "EAS_BUILD_ID=$(jq -r '.[0].id' eas-build-output.json)" >> "$GITHUB_ENV"

      - name: Download APK from EAS
        id: eas-download
        run: |
          eas build:download --build-id "$EAS_BUILD_ID" --json --non-interactive > eas-download-output.json
          echo "APK_PATH=$(jq -r '.path' eas-download-output.json)" >> "$GITHUB_ENV"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}